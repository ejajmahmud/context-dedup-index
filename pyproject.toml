[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-dedup-index"
version = "0.1.0"
description = "MinHash and Jaccard similarity index detecting and pruning redundant context chunks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
context-dedup-index = "context_dedup_index.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_dedup_index*"]
